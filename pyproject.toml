[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vox2txt"
version = "0.1.0"
description = "Push-to-talk speech to text: hold a key, speak, and the transcription is pasted into whatever window has focus."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "dan" }]
keywords = ["speech-to-text", "whisper", "push-to-talk", "dictation", "wayland"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "faster-whisper>=1.0",
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "tomli>=2.0; python_version < '3.11'",
    # Linux: raw /dev/input for the hotkey, /dev/uinput to inject the paste.
    "evdev>=1.6; sys_platform == 'linux'",
    # Windows: hotkey capture and paste both go through pynput.
    "pynput>=1.7; sys_platform == 'win32'",
    "plyer>=2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# X11 sessions use pynput rather than raw evdev.
x11 = ["pynput>=1.7"]

[project.urls]
Homepage = "https://github.com/Dan-Araya/vox2txt"
Issues = "https://github.com/Dan-Araya/vox2txt/issues"

[project.scripts]
vox2txt = "vox2txt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vox2txt"]

[tool.hatch.build.targets.sdist]
include = ["/vox2txt", "/README.md"]
